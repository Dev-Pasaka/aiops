global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo-app
    metrics_path: /api/metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["demo-app:3000"]
        labels: { service: demo-app, container: demo-app }

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels: { service: nginx }

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep only this stack's containers; the Circaso containers on the same host are none of our business.
      - source_labels: [container_label_com_docker_compose_project]
        regex: aiops
        action: keep
      - source_labels: [name]
        target_label: container
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: container_label_.*|id|image
        action: labeldrop

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
