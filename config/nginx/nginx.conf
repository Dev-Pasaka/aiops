# Front door of the AIOps stack. The Circaso Nginx terminates TLS and forwards aiops.circaso.com here.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # The Circaso Nginx (a private Docker address) passes the visitor's real IP in X-Forwarded-For.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # Standard combined format: this is what CrowdSec's Nginx parser reads.
    access_log /dev/stdout combined;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Names are looked up per request, so Nginx starts and keeps running while demo-app is down.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80 default_server;
        client_max_body_size 1m;

        set $demo_app demo-app:3000;
        set $grafana grafana:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;

        # Metrics are for Prometheus inside the Docker network only.
        location = /api/metrics { return 404; }

        location /grafana/ {
            proxy_pass http://$grafana;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://$demo_app;
            proxy_read_timeout 60s;
            # Shown for page loads while the app is down. API calls keep their real status code.
            error_page 502 503 504 /down.html;
        }

        location = /down.html {
            internal;
            root /usr/share/nginx/html;
        }
    }

    # Connection counters for the Prometheus exporter; reachable only inside the Docker network.
    server {
        listen 8080;
        access_log off;
        location = /stub_status { stub_status; }
        location / { return 404; }
    }
}
