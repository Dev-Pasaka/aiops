<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Demo Bank is unavailable</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: clamp(2rem, 5vw, 3.25rem); margin: 0 0 12px; }
  p { font-size: 1.25rem; color: #94a3b8; margin: 0; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #ef4444; margin-right: 12px;
         animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
  <main>
    <h1><span class="dot"></span>Demo Bank is unavailable</h1>
    <p>We can't reach the service right now. This page retries every 5 seconds.</p>
  </main>
</body>
</html>
