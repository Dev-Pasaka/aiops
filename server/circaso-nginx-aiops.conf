# Installed as /opt/circaso/nginx/aiops.conf on the server (the existing Circaso Nginx owns port 443).
# Forwards https://aiops.circaso.com to the AIOps demo's own Nginx over the shared Docker network.
# The name is looked up per request, so this Nginx starts and reloads fine while the demo stack is down.
server {
    listen 443 ssl;
    http2 on;
    server_name aiops.circaso.com;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 1m;

    # Same lock as the other sites: only Cloudflare may connect.
    if ($from_cloudflare = 0) { return 444; }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $aiops aiops-nginx:80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://$aiops;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # After real_ip, $remote_addr is the visitor's true address (from CF-Connecting-IP).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }
}
